<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>HelpClinic Login</title>
    <meta name="HelpClinic" content="Um site que busca ajudar clínicas de hospitais">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_login.css') }}">
    <!-- CSRF Token para proteção contra ataques CSRF -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
    <main>
        <form action="{{ url_for('inicio') }}" method="post">
            {{ form.hidden_tag() }}
            <div class="container">
                <h1>Login HelpClinic</h1>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert">
                            {% for message in messages %}
                                <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <div>
                    <input placeholder='E-mail' name="email" type="email" autocomplete="email" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div>
                    <input placeholder='Senha' name="senha" type="password" autocomplete="current-password" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div>
                    <label>
                        <input type="checkbox"> Lembrar minha senha
                    </label>
                    <br>
                    <br>
                    <a href="#">Esqueci minha senha</a>
                </div>
                <div>
                    <p>Não tem uma conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
                </div>
                <button type="submit">Login</button>
            </div>
        </form>

    </main>
    <footer>

    </footer>
</body>

</html>
