<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HelpClinic</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <div class="auth-container">
        <form action="{{ url_for('inicio') }}" method="post" class="auth-form">
            {{ form.csrf_token() }}
            
            <h1>🏥 HelpClinic</h1>
            <p>Faça login para acessar sua conta</p>

            <!-- Mensagens de alerta -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required 
                    autocomplete="email">
            </div>

            <!-- Senha -->
            <div class="form-group">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password">
            </div>

            <!-- Lembrar-me -->
            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember" value="on">
                <label for="remember">Lembrar-me neste dispositivo por 30 dias</label>
            </div>

            <!-- Link esqueci senha -->
            <div class="forgot-password">
                <a href="#">Esqueci minha senha</a>
            </div>

            <!-- Botões de ação -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Fazer Login</button>
            </div>

            <!-- Link para cadastro -->
            <div class="auth-footer">
                Não tem uma conta? <a href="{{ url_for('cadastro') }}">Cadastre-se aqui</a>
            </div>
        </form>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
