<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - HelpClinic</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
</head>
<body>

        <div class="error-content">
            <div class="error-code">404</div>
            <h1>Página não encontrada</h1>
            <p>Desculpe, a página que você está procurando não existe ou foi movida para outro lugar.</p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary">← Voltar para Início</a>

        </div>
    </div>

</html>
