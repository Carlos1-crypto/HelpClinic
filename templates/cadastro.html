<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - HelpClinic</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <div class="auth-container">
        <form action="{{ url_for('cadastro') }}" method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <h1>🏥 HelpClinic</h1>
            <p>Crie sua conta para começar</p>

            <!-- Mensagens de alerta -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required 
                    autocomplete="email">
            </div>

            <!-- Senha -->
            <div class="form-group">
                <label for="senha1">Senha</label>
                <input 
                    type="password" 
                    id="senha1" 
                    name="senha1" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="new-password">
                <small style="color: var(--text-tertiary); display: block; margin-top: 4px;">
                    Mínimo 8 caracteres, 1 maiúscula e 1 número
                </small>
            </div>

            <!-- Confirmar Senha -->
            <div class="form-group">
                <label for="senha2">Confirmar Senha</label>
                <input 
                    type="password" 
                    id="senha2" 
                    name="senha2" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="new-password">
            </div>

            <!-- Botões de ação -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Criar Conta</button>
            </div>

            <!-- Link para login -->
            <div class="auth-footer">
                Já tem uma conta? <a href="{{ url_for('inicio') }}">Faça login aqui</a>
            </div>
        </form>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
